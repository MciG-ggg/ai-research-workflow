# AI Research Workflow (OMC)

## Purpose

Turn an AI/ML research idea into artifact-gated research work under Claude Code/oh-my-claudecode. Keep scientific intent, implementation work, run evidence, and claims separated so evidence controls conclusions.

This skill is the OMC-flavored sibling of the Codex/OMX `ai-research-workflow` skill. It shares the artifact contract and Python guardrail scripts but routes workflow gates through OMC slash commands and keeps the portfolio/workstream control plane under `.ai-research-workflow/`.

## OMC integration

| OMX (Codex) command | OMC (Claude Code) command |
| --- | --- |
| `$deep-interview --autoresearch` | `/oh-my-claudecode:deep-interview --autoresearch` |
| `$ralplan` | `/oh-my-claudecode:ralplan` |
| `$autoresearch` | `/oh-my-claudecode:autoresearch` |
| `$ralph` | `/oh-my-claudecode:ralph` |
| `$autopilot` | `/oh-my-claudecode:autopilot` |
| `$ultrawork` | `/oh-my-claudecode:ultrawork` |
| `$team` | `/oh-my-claudecode:team` |

## Control plane

- Portfolio: `.ai-research-workflow/RESEARCH.md`, `.ai-research-workflow/INDEX.md` (and optional `IDEA_SCOUTING.md`, `PAPERS.md`, `CONFIG.md`).
- Workstream: `.ai-research-workflow/<slug>/{STATE.json,RESEARCH.md,LITERATURE.md,REPRODUCTION.md,EXPERIMENT.md,RUNS.md,RESULTS.md,CLAIMS.md,REPRODUCIBILITY.md,SCRIPT_REGISTRY.md,CLOSEOUT.md}` plus `scripts/` and `runs/`.
- Worktree registry: `.omc/worktrees/REGISTRY.md` in the target repo.
- OMC plan/spec outputs: `.omc/plans/prd-<slug>.md`, `.omc/plans/test-spec-<slug>.md`, `.omc/specs/autoresearch-<slug>/{mission.md,sandbox.md,result.json}`.

## Install

```bash
git clone https://github.com/MciG-ggg/ai-research-workflow.git
mkdir -p ~/.claude/skills
cp -R ai-research-workflow/skills/ai-research-workflow-omc ~/.claude/skills/
```

Use the updater after pulling repo changes:

```bash
./skills/ai-research-workflow-omc/scripts/update_installed_skill.sh
```

