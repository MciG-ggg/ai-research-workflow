# 环境前提：<题目 ID>

# 前置 check（按顺序跑，任意一条失败则该题不计分）
setup:
  - name: "工作目录存在"
    cmd: ["test", "-d", "{{project_root}}"]
  - name: "目标文件存在"
    cmd: ["test", "-f", "{{fixture_path}}"]
  - name: "Python 可用"
    cmd: ["python3", "--version"]
    expect_stdout_contains: "Python 3"

# v1: env.yaml 的 setup 步骤会被 transcript.record("tool_call", cmd=...) 记录，
# 考生通过 `wc -l <fixture_path>` / `head -3 <fixture_path>` 之类的 shell 调用
# 也能在 transcript 里留下 read 痕迹。rubric H 项里 "transcript 中存在对 X 的读"
# 就是检查这一点。

# 注入到考生进程的环境变量
env:
  HARNESS_EVAL_ITEM_ID: "{{item_id}}"
  HARNESS_EVAL_TASK_PATH: "{{task_md_path}}"
  HARNESS_EVAL_PROJECT_ROOT: "{{project_root}}"
  HARNESS_EVAL_TIMEOUT: "{{timeout_seconds}}"

# 期望考生产出的工件（判官会校验存在性与基础 schema）
outputs:
  - path: "{{project_root}}/.ai-research-workflow/{{slug}}/EXPERIMENT.md"
    must_exist: true
    min_bytes: 200
    must_contain_sections:
      - "Hypothesis"
      - "Baselines"
      - "Metrics"
    must_contain_keywords: []

  # 可选：如果考生应该写出 JSON 指标
  - path: "{{project_root}}/.ai-research-workflow/{{slug}}/metrics.json"
    must_exist: false        # 可选工件
    json_schema:
      type: object
      required: ["runs", "metrics"]
      properties:
        runs: {type: integer}
        metrics: {type: object}

# 考生超时时间
timeout_seconds: 120

# 沙箱隔离方式
isolation: git_worktree
worktree:
  base_branch: "main"
  copy_untracked: true       # 是否复制 .claude/ 等未跟踪文件
