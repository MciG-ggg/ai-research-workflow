# 环境前提：001_experiment_design

setup:
  - name: "工作目录存在"
    cmd: ["test", "-d", "{{project_root}}"]
  - name: "fixture RESEARCH.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/RESEARCH.md"]
  - name: "fixture literature_notes.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/literature_notes.md"]
  - name: "Python 可用"
    cmd: ["python3", "--version"]
    expect_stdout_contains: "Python 3"

env:
  HARNESS_EVAL_ITEM_ID: "001_experiment_design"
  HARNESS_EVAL_TASK_PATH: "{{task_md_path}}"
  HARNESS_EVAL_RESEARCH_MD: "{{fixture_dir}}/RESEARCH.md"
  HARNESS_EVAL_LITERATURE_NOTES: "{{fixture_dir}}/literature_notes.md"
  HARNESS_EVAL_PROJECT_ROOT: "{{project_root}}"
  HARNESS_EVAL_SLUG: "{{slug}}"
  HARNESS_EVAL_TIMEOUT: "{{timeout_seconds}}"

outputs:
  - path: "{{project_root}}/.omx/ai-research/{{slug}}/EXPERIMENT.md"
    must_exist: true
    min_bytes: 500
    must_contain_sections:
      - "Hypothesis"
      - "Baselines"
      - "Metrics"
      - "Dataset"

timeout_seconds: 120

isolation: git_worktree
worktree:
  base_branch: "feat/claude-version-of-ai-research-workflow"
  copy_untracked: true
