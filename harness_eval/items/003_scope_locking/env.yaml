# 环境前提：003_scope_locking

setup:
  - name: "工作目录存在"
    cmd: ["test", "-d", "{{project_root}}"]
  - name: "fixture RESEARCH.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/RESEARCH.md"]
  - name: "fixture NEW_REQUEST.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/NEW_REQUEST.md"]
  - name: "Python 可用"
    cmd: ["python3", "--version"]

env:
  HARNESS_EVAL_ITEM_ID: "003_scope_locking"
  HARNESS_EVAL_TASK_PATH: "{{task_md_path}}"
  HARNESS_EVAL_RESEARCH_MD: "{{fixture_dir}}/RESEARCH.md"
  HARNESS_EVAL_NEW_REQUEST: "{{fixture_dir}}/NEW_REQUEST.md"
  HARNESS_EVAL_PROJECT_ROOT: "{{project_root}}"
  HARNESS_EVAL_SLUG: "{{slug}}"
  HARNESS_EVAL_TIMEOUT: "{{timeout_seconds}}"

outputs:
  - path: "{{project_root}}/.ai-research-workflow/{{slug}}/SCOPE.md"
    must_exist: true
    min_bytes: 500
    must_contain_sections:
      - "in_scope"
      - "out_of_scope"
      - "deferred"

timeout_seconds: 120

isolation: git_worktree
worktree:
  base_branch: "feat/claude-version-of-ai-research-workflow"
  copy_untracked: true
