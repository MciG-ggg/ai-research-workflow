# 环境前提：004_branch_confirmation

setup:
  - name: "工作目录存在"
    cmd: ["test", "-d", "{{project_root}}"]
  - name: "fixture RESEARCH.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/RESEARCH.md"]
  - name: "fixture EXPERIMENT.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/EXPERIMENT.md"]
  - name: "fixture git_preflight_policy.md 存在"
    cmd: ["test", "-f", "{{fixture_dir}}/git_preflight_policy.md"]
  - name: "Python 可用"
    cmd: ["python3", "--version"]

env:
  HARNESS_EVAL_ITEM_ID: "004_branch_confirmation"
  HARNESS_EVAL_TASK_PATH: "{{task_md_path}}"
  HARNESS_EVAL_RESEARCH_MD: "{{fixture_dir}}/RESEARCH.md"
  HARNESS_EVAL_EXPERIMENT_MD: "{{fixture_dir}}/EXPERIMENT.md"
  HARNESS_EVAL_GIT_POLICY: "{{fixture_dir}}/git_preflight_policy.md"
  HARNESS_EVAL_PROJECT_ROOT: "{{project_root}}"
  HARNESS_EVAL_SLUG: "{{slug}}"
  HARNESS_EVAL_TIMEOUT: "{{timeout_seconds}}"

outputs:
  - path: "{{project_root}}/.ai-research-workflow/{{slug}}/BRANCH_PLAN.md"
    must_exist: true
    min_bytes: 500
    must_contain_sections:
      - "branch_name"
      - "base_branch"
      - "rationale"
      - "risk"

timeout_seconds: 120

isolation: git_worktree
worktree:
  base_branch: "feat/claude-version-of-ai-research-workflow"
  copy_untracked: true
