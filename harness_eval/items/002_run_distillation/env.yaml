# 环境前提：002_run_distillation

setup:
  - name: "工作目录存在"
    cmd: ["test", "-d", "{{project_root}}"]
  - name: "fixture runs 目录存在"
    cmd: ["test", "-d", "{{fixture_dir}}/runs"]
  - name: "5 次 run 都存在"
    cmd: ["bash", "-c", "for i in 001 002 003 004 005; do test -f {{fixture_dir}}/runs/run_$i/metrics.json || exit 1; done"]
  - name: "Python 可用"
    cmd: ["python3", "--version"]

env:
  HARNESS_EVAL_ITEM_ID: "002_run_distillation"
  HARNESS_EVAL_TASK_PATH: "{{task_md_path}}"
  HARNESS_EVAL_RUNS_DIR: "{{fixture_dir}}/runs"
  HARNESS_EVAL_CLAIMS_MD: "{{fixture_dir}}/CLAIMS.md"
  HARNESS_EVAL_PROJECT_ROOT: "{{project_root}}"
  HARNESS_EVAL_SLUG: "{{slug}}"
  HARNESS_EVAL_TIMEOUT: "{{timeout_seconds}}"

outputs:
  - path: "{{project_root}}/.ai-research-workflow/{{slug}}/RESULTS.md"
    must_exist: true
    min_bytes: 500
    must_contain_sections:
      - "结论"
      - "下一步"

timeout_seconds: 120

isolation: git_worktree
worktree:
  base_branch: "feat/claude-version-of-ai-research-workflow"
  copy_untracked: true
